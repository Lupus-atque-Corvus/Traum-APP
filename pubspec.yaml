name: traum
description: "TRAUM — Dein persönliches Dashboard"
publish_to: 'none'

version: 0.9.5+95

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.0

  # Datenbank
  drift: ^2.20.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Gesundheit
  health: ^13.1.4

  # Kalender Sync
  device_calendar: ^4.3.2

  # Charts
  fl_chart: ^1.0.0

  # Benachrichtigungen
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

  # Background Tasks
  workmanager: ^0.9.0

  # Homescreen Widgets
  home_widget: ^0.9.0

  # Biometrie
  local_auth: ^3.0.0

  # HTTP
  http: ^1.2.2

  # GPS
  geolocator: ^14.0.0

  # Teilen
  share_plus: ^12.0.0

  # Archiv
  archive: ^3.6.0

  # Datei-Auswahl (Vault-Import)
  file_picker: ^11.0.0

  # Links
  url_launcher: ^6.3.0

  # App-Info
  package_info_plus: ^8.0.0

  # Bilder
  image_picker: ^1.1.2
  video_player: ^2.9.2
  # Erzeugt das Vorschaubild für Video-Einträge im Tagebuch
  # (DiaryCameraService.generateVideoThumbnail). War bis v0.8.8 zwar
  # deklariert, aber nie verdrahtet — Video-Einträge hatten deshalb gar
  # kein Vorschaubild.
  video_thumbnail: ^0.5.3
  # Eigene Live-Kamera-Vorschau (core/camera/OverlayCameraScreen) für das
  # Geist-Overlay-Referenzfoto beim Tagebuch-Aufnehmen — image_picker öffnet
  # nur die native Kamera-App, über die sich kein Flutter-Overlay legen lässt.
  camera: ^0.11.0

  # Barcode-Scanner
  mobile_scanner: ^7.0.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Datei öffnen
  open_file: ^3.3.2

  # Kalender UI
  table_calendar: ^3.1.2

  # SVG
  flutter_svg: ^2.0.10+1
  # Vorkompilierte Vektorgrafiken (.vec) für die 838 Übungs-Icons: das
  # Binärformat ist bereits geparst, zur Laufzeit entfallen XML- und
  # Pfad-Parsing komplett. Neu erzeugen mit:
  #   dart run vector_graphics_compiler \
  #     --input-dir assets/exercises/icons_exercise \
  #     --out-dir assets/exercises/icons_exercise_vec
  # (Die .svg-Quellen bleiben im Repo, werden aber NICHT mehr mit
  # ausgeliefert — siehe assets-Abschnitt unten.)
  vector_graphics: ^1.2.2

  # Gerätinfos
  device_info_plus: ^11.0.0

  # Verbindung
  connectivity_plus: ^6.1.0

  # Markdown (flutter_markdown ist eingestellt; flutter_markdown_plus ist der
  # aktiv gepflegte Nachfolger mit kompatibler API. LaTeX über die _latex-
  # Erweiterung, Mathe-Rendering über flutter_math_fork.)
  flutter_markdown_plus: ^1.0.3
  flutter_markdown_plus_latex: ^1.0.1
  markdown: ^7.2.1
  flutter_math_fork: ^0.7.3

  # YAML (Frontmatter-Parsing für Notiz-Properties)
  yaml: ^3.1.2

  # Graph View (kraftgerichteter Graph für Notiz-Verlinkungen)
  graphview: ^1.2.0

  # i18n
  intl: ^0.20.0

  # Permissions
  permission_handler: ^12.0.0

  # Screen Keep-Awake
  wakelock_plus: ^1.3.0

  # Icons
  cupertino_icons: ^1.0.8

  # App-Launcher (experimentell, Android): installierte Apps auflisten/starten
  installed_apps: ^2.1.1

  # Graffiti Map — Karte, Marker-Clustering, Geo, EXIF, Export
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.0.0
  geocoding: ^4.0.0
  exif: ^3.3.0
  image: ^4.2.0
  gpx: ^2.2.2
  flutter_map_location_marker: ^10.0.0
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.6
  http_cache_file_store: ^2.0.1
  flutter_staggered_grid_view: ^0.7.0

  # PDF-Export (Ernährungs-Report)
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  riverpod_generator: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # flutter_native_splash bewusst NICHT als Abhängigkeit eingetragen:
  # Es bringt (anders als flutter_launcher_icons) nativen Android-Code mit
  # ("native_build": true). Als dev_dependency landet es in
  # GeneratedPluginRegistrant.java, wird beim Release-Build aber nicht in den
  # Compile-Classpath aufgenommen -> "package net.jonhanson.flutter_native_splash
  # does not exist", Release-Build bricht ab (Debug-Build lief durch).
  # Die Splash-Ressourcen sind bereits generiert und eingecheckt
  # (android/app/src/main/res/drawable*/launch_background.xml + values*/styles.xml),
  # die Dart-API wird nirgends verwendet -> zur Laufzeit wird das Paket nicht gebraucht.
  # Zum Neugenerieren des Splash: Paket temporär hinzufügen,
  # `dart run flutter_native_splash:create` (nutzt den Konfigblock unten),
  # danach wieder entfernen.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0D0D1A"
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/exercises/
    - assets/exercises/icons/
    # assets/exercises/icons_exercise/ (die .svg-Quellen, 20 MB) wird bewusst
    # NICHT ausgeliefert — nur die daraus vorkompilierten .vec-Dateien (13 MB).
    # Die Quellen bleiben im Repo, um die .vec neu erzeugen zu können.
    - assets/exercises/icons_exercise_vec/
    - assets/supplements/
    - assets/icons/progress/
    - assets/legal/
    # assets/lottie/ entfernt: Verzeichnis existiert nicht und wird nirgends
    # referenziert -> erzeugte bei jedem `flutter analyze`/Build eine Warnung.
    - assets/substances_reference.sqlite3
    - assets/data/
    - assets/reference_templates/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
