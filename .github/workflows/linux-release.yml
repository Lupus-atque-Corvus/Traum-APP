name: Build Linux release artifact

# Builds the desktop Linux bundle on an ubuntu-latest runner and attaches it
# to the GitHub release that triggered the workflow. This exists because the
# maintainer's own machine is Windows-only (Windows builds + Android APKs are
# built and released locally) — this workflow is the only place the Linux
# artifact gets produced, so it must run on every release, not just some.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Package bundle
        run: |
          cd build/linux/x64/release
          tar -czf traum-linux-x64.tar.gz bundle

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            build/linux/x64/release/traum-linux-x64.tar.gz --clobber

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: traum-linux-x64
          path: build/linux/x64/release/traum-linux-x64.tar.gz
